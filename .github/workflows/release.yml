name: Release

# Pushing a tag vX.Y.Z (matching package.json) builds the buni command for every platform, publishes a GitHub
# release with the binaries and their Homebrew bottles, and updates the formula in emusoi/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Each binary is built on its own platform: the keychain module is native code.
    strategy:
      matrix:
        include:
          - { runner: macos-14, target: bun-darwin-arm64, asset: darwin-arm64 }
          - { runner: macos-15-intel, target: bun-darwin-x64, asset: darwin-x64 }
          - { runner: ubuntu-24.04, target: bun-linux-x64, asset: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: bun-linux-arm64, asset: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: The tag is the version in package.json
        run: test "v$(bun -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun scripts/compile.ts ${{ matrix.target }} dist/buni
      # macOS runs only signed code; an ad-hoc signature is all a command-line tool needs.
      - if: runner.os == 'macOS'
        run: codesign --force --sign - dist/buni
      - name: The binary runs
        run: dist/buni --version && dist/buni tree examples/portal.buni > /dev/null
      - name: Package
        run: |
          name="buni-${GITHUB_REF_NAME#v}-${{ matrix.asset }}.tar.gz"
          tar -czf "$name" -C dist buni
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      # Homebrew pours bottles as they are; a formula without them counts as built from source.
      - name: Bottles
        run: bun scripts/bottles.ts "${GITHUB_REF_NAME#v}" assets
      - name: Checksums
        run: cd assets && sha256sum buni-*.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "buni ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Update the Homebrew formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          umask 077; printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:emusoi/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          bun scripts/formula.ts "$version" assets/checksums.txt > "$RUNNER_TEMP/tap/Formula/buni.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/buni.rb
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "buni $version"
          git push -q origin HEAD
