<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buni snap</title>
<style>
  :root { color-scheme: dark; --bg: #18181b; --field: #232327; --line: rgba(255,255,255,.1); --ink: #ededef; --mute: #a9a9b3; --blue: #4069e6; }
  body { margin: 0; width: 320px; background: var(--bg); color: var(--ink); font: 13px/1.4 "Instrument Sans", system-ui, sans-serif; }
  main { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  h1 { margin: 0; font-size: 15px; font-weight: 700; }
  p { margin: 0; color: var(--mute); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mute); }
  input, select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 13px inherit; cursor: pointer; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 18px; }
  #status.error { color: #ff8a80; }
</style>
</head>
<body>
<main>
  <h1>Snap into buni</h1>
  <p>Brings this page into a design as editable layers, as you see it, signed in and all.</p>
  <label>buni editor <input id="server" placeholder="Paste the link buni open printed" spellcheck="false"></label>
  <label>Design <select id="file" disabled><option>Connect to an editor first</option></select></label>
  <label>Page name <input id="name" placeholder="This page’s title · Now"></label>
  <div class="row">
    <button id="pick" type="button">Pick a part</button>
    <button id="page" type="button" class="primary">Snap page</button>
  </div>
  <p id="status" role="status"></p>
</main>
<script src="popup.js" type="module"></script>
</body>
</html>
