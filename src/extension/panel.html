<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buni</title>
<style>
  /* One ink, one grey, one green for "working"; type and space do the rest (designs/extension.buni, Minimal). */
  :root { color-scheme: dark; --bg: #141414; --ink: #f2f2f2; --mute: #9a9a9a; --line: rgba(255,255,255,.08); --rule: rgba(255,255,255,.14); --live: #7fd3a0; --red: #ff9a90; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; min-width: 260px; background: var(--bg); color: var(--ink); font: 13px/1.45 "Instrument Sans", system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .view { display: none; flex-direction: column; height: 100%; padding: 20px 24px; max-width: 560px; margin: 0 auto; }
  .view.on { display: flex; }
  .top { display: flex; align-items: center; justify-content: space-between; min-height: 24px; }
  .brand { font-weight: 700; letter-spacing: -.2px; }
  .quiet { color: var(--mute); font-size: 12px; }
  .quiet:hover, .link:hover { color: var(--ink); }
  .page { display: flex; flex-direction: column; gap: 4px; margin-top: 48px; }
  .page h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.4px; overflow-wrap: anywhere; }
  .where { position: relative; display: flex; align-items: center; gap: 6px; margin-top: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); color: var(--mute); }
  .where b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The real select sits invisibly over the line: the line is what shows, the select is what's used. */
  .where select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .actions { display: flex; align-items: center; gap: 20px; margin-top: 20px; }
  .pill { padding: 10px 18px; border-radius: 9999px; background: var(--ink); color: var(--bg); font-weight: 600; }
  .pill:disabled, .link:disabled { opacity: .5; cursor: default; }
  .link { color: var(--ink); }
  .also { margin-top: 16px; align-self: flex-start; }
  .status { margin-top: 16px; min-height: 18px; color: var(--mute); font-size: 12px; }
  .status.error { color: var(--red); }
  .status details summary { cursor: pointer; list-style: none; }
  .status details summary::after { content: " · details"; text-decoration: underline; }
  .status details p { margin: 6px 0 0; max-height: 140px; overflow: auto; font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; word-break: break-word; }
  .rows { margin-top: auto; display: flex; flex-direction: column; }
  .rows h2 { margin: 24px 0 4px; font-size: 12px; font-weight: 600; color: var(--mute); }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 0; border-top: 1px solid var(--line); text-align: left; }
  .row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .state { color: var(--mute); font-size: 12px; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--mute); flex-shrink: 0; }
  .dot.live { background: var(--live); }
  .progress { display: flex; align-items: center; gap: 8px; margin-top: 24px; font-size: 15px; }
  .brief { margin: 12px 0 0; color: var(--mute); }
  .find { margin-top: 20px; padding: 0 0 10px; width: 100%; border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink); font: inherit; font-size: 15px; outline: none; }
  .scroll { flex: 1; overflow: auto; margin-top: 8px; }
  /* buni itself, beside the page. */
  #view-editor { padding: 0; max-width: none; }
  #view-editor .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #view-editor .bar b { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #view-editor iframe { flex: 1; width: 100%; border: 0; background: #111; }
</style>
</head>
<body>

<section class="view on" id="view-home">
  <header class="top"><span class="brand">buni</span><button class="quiet" id="to-library" type="button">Library</button></header>
  <div class="page"><span class="quiet" id="host"></span><h1 id="title">This page</h1></div>
  <label class="where" title="Where this site's captures go">Goes to <b id="where-label">a scratch design</b><span aria-hidden="true">▾</span>
    <select id="where" aria-label="Where this site's captures go"></select>
  </label>
  <div class="actions">
    <button class="pill" id="capture" type="button">Capture page</button>
    <button class="link" id="pick" type="button">Pick a part</button>
  </div>
  <button class="quiet also" id="inspire" type="button">or keep it as inspiration</button>
  <div class="status" id="status" role="status"></div>
  <div class="rows" id="recent"></div>
</section>

<section class="view" id="view-watch">
  <header class="top"><button class="quiet" id="watch-back" type="button">← buni</button><button class="quiet" id="watch-library" type="button">Library</button></header>
  <div class="page"><span class="quiet" id="watch-where"></span><h1 id="watch-title"></h1></div>
  <div class="progress"><span class="dot live" id="watch-dot"></span><span id="watch-state"></span></div>
  <p class="brief" id="watch-note"></p>
  <div class="actions">
    <button class="pill" id="watch-open" type="button">Open</button>
    <button class="link" id="watch-copy" type="button">Copy for Claude</button>
  </div>
  <div class="status" id="watch-status" role="status"></div>
  <div class="rows" id="watch-others"></div>
</section>

<section class="view" id="view-library">
  <header class="top"><button class="quiet" id="library-back" type="button">← buni</button><span class="quiet">Library</span></header>
  <input class="find" id="find" type="search" placeholder="Find a capture or a pattern" aria-label="Find a capture or a pattern">
  <div class="scroll"><div class="rows" id="library"></div></div>
</section>

<section class="view" id="view-editor">
  <div class="bar"><button class="quiet" id="editor-back" type="button">←</button><b id="editor-title"></b><button class="quiet" id="editor-capture" type="button" title="Capture the page you're on into this design">+ Capture here</button><button class="quiet" id="editor-out" type="button" title="Open in a tab">↗</button></div>
  <div class="status" id="editor-status" role="status" style="margin:0;padding:0 14px"></div>
  <iframe id="frame" title="buni editor"></iframe>
</section>

<script src="panel.js" type="module"></script>
</body>
</html>
