<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buni</title>
<style>
  :root { color-scheme: dark; --bg: #18181b; --raised: #1f1f23; --field: #26262b; --line: rgba(255,255,255,.1); --ink: #ededef; --mute: #b4b4bd; --blue: #4069e6; --green: #6ec896; --red: #ff9a90; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; min-width: 260px; background: var(--bg); color: var(--ink); font: 13px/1.4 "Instrument Sans", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 800; font-size: 15px; margin-right: 8px; }
  .tab { padding: 6px 10px; border-radius: 8px; border: 0; background: transparent; color: var(--mute); font: inherit; font-weight: 600; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--field); color: var(--ink); }
  section.view { display: none; flex: 1; flex-direction: column; gap: 12px; padding: 14px 12px; overflow: auto; }
  section.view.on { display: flex; }
  p { margin: 0; color: var(--mute); }
  /* Two intents as one switch: it fits a narrow panel and reads as a choice. */
  .switch { display: flex; padding: 3px; border-radius: 10px; background: var(--field); }
  .switch button { flex: 1; min-height: 32px; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--mute); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .switch button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  /* Into and Name side by side when there is room, stacked when there isn't. */
  .pair { display: flex; flex-wrap: wrap; gap: 8px; }
  .pair label { flex: 1 1 170px; min-width: 0; }
  .pair select, .pair input { width: 100%; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mute); }
  label[hidden] { display: none; }
  input, select, textarea { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; }
  textarea { resize: vertical; min-height: 52px; }
  .row { display: flex; gap: 8px; }
  button.act { flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  button.act.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.act:disabled { opacity: .5; cursor: default; }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); }
  .card b { font-size: 13px; }
  .card .meta { font-size: 12px; color: var(--mute); }
  .card .brief { font-size: 12px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .row button.act { flex: 0 0 auto; }
  .card .row button.act[data-do="copy"] { flex: 1; background: var(--blue); border-color: var(--blue); color: #fff; }
  .card code { font: 12px "JetBrains Mono", ui-monospace, monospace; word-break: break-all; color: var(--mute); }
  .ok { color: var(--green); }
  #status:empty { display: none; }
  #status { font-size: 12px; color: var(--mute); }
  #status.error { color: var(--red); }
  /* A long error shows its first line; the rest is one click away. */
  #status details summary { cursor: pointer; list-style: none; }
  #status details summary::after { content: " Details"; color: var(--mute); text-decoration: underline; }
  #status details[open] summary::after { content: " Hide"; }
  #status details p { margin-top: 6px; max-height: 160px; overflow: auto; color: var(--mute); font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; word-break: break-word; }
  .status { min-height: 0; font-size: 12px; color: var(--mute); }
  .empty { padding: 24px 4px; text-align: center; }
  /* The editor, inside the panel. */
  #editor { display: none; flex: 1; flex-direction: column; }
  #editor.on { display: flex; }
  #editor .bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  #editor .bar b { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #editor iframe { flex: 1; border: 0; width: 100%; background: #111; }
  .icon { padding: 6px 8px; border-radius: 6px; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header role="tablist" aria-label="buni">
  <span class="brand">buni</span>
  <button class="tab" role="tab" id="tab-capture" aria-selected="true">Capture</button>
  <button class="tab" role="tab" id="tab-snaps" aria-selected="false">Snaps</button>
  <button class="tab" role="tab" id="tab-inspiration" aria-selected="false">Inspiration</button>
</header>

<section class="view on" id="view-capture" role="tabpanel">
  <div class="switch" role="group" aria-label="What it's for">
    <button type="button" id="redesign" aria-pressed="true" title="Into a design, to improve it">Redesign it</button>
    <button type="button" id="inspire" aria-pressed="false" title="Into your inspiration library">Keep as inspiration</button>
  </div>
  <label id="brief-field">What should change? <textarea id="brief" rows="3" placeholder="Make the plans easier to compare; the CTA gets lost"></textarea></label>
  <label id="use-field" hidden>Use it for <textarea id="use" rows="2" placeholder="When is this the right pattern?"></textarea></label>
  <div class="pair">
    <label id="into-field">Into <select id="into"><option value="scratch">A new scratch design</option></select></label>
    <label>Name <input id="name" placeholder="This page’s title"></label>
  </div>
  <div class="row">
    <button id="pick" type="button" class="act">Pick a part</button>
    <button id="page" type="button" class="act primary">Capture page</button>
  </div>
  <div id="status" role="status"></div>
  <div id="result"></div>
</section>

<section class="view" id="view-snaps" role="tabpanel">
  <div id="snaps"></div>
</section>

<section class="view" id="view-inspiration" role="tabpanel">
  <input id="find" type="search" placeholder="Find a pattern: settings, pricing, empty state…" aria-label="Find a pattern">
  <div id="patterns"></div>
</section>

<div id="editor">
  <div class="bar">
    <button class="icon" id="back" type="button" aria-label="Back">←</button>
    <b id="editor-title"></b>
    <button class="icon" id="pop-out" type="button" title="Open in a tab">↗</button>
  </div>
  <iframe id="frame" title="buni editor"></iframe>
</div>
<script src="panel.js" type="module"></script>
</body>
</html>
